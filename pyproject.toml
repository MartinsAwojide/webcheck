[project]
name = "webcheck"
version = "0.1.0"
description = "Print-defect inspection demo for flexible-packaging web: an anomaly gate, then a defect detector, on a Jetson Orin Nano or any PC"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
]

[project.scripts]
webcheck-demo = "webcheck.launcher:main"

[project.optional-dependencies]
demo = [
    "paho-mqtt>=2.1.0",
    "pillow>=12.3.0",
]
onnx = [
    "onnxruntime>=1.24.3",
]
webgpu = [
    "onnxruntime>=1.24.4 ; python_full_version >= '3.11'",
    "onnxruntime-ep-webgpu>=0.5.0 ; (python_full_version >= '3.11' and platform_machine == 'arm64') or (python_full_version >= '3.11' and sys_platform != 'darwin')",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"webcheck.inference" = ["static/fonts/*.woff2", "static/map_template.*", "static/severity_bands.json"]

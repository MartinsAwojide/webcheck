# Every operator type of the Studio graphs on ONNX Runtime's WebGPU provider, on Linux through Mesa's software Vulkan
# driver (lavapipe): GitHub's runners have no GPU. See scripts/webgpu_op_check.py.
# To run it on GitHub, copy this file to .github/workflows/ (pushing it there needs the `workflow` permission).
name: webgpu-linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  webgpu-ops:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Vulkan through Mesa's software driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10
      - name: Python environment
        run: uv sync --python 3.12 --extra onnx --extra webgpu
      - name: Every Studio-graph operator on WebGPU, no CPU fallback
        run: uv run --with onnx python scripts/webgpu_op_check.py

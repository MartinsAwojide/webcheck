<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d">
  <title id="t">How webcheck works</title>
  <desc id="d">A 1920x1080 frame is cut into six 640x640 tiles. The FOMO-AD gate scores every tile. Flagged tiles go to the YOLO-Pro detector, which feeds the HMI on port 8080, a JSON-lines defect log, and MQTT UNS topics. MQTT feeds the defect map on port 8090 with SQLite history.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;text-anchor:middle}
      .h{font-size:17px;font-weight:600}
      .s{font-size:14px;fill:#57606a}
      .n{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
      .g{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
      .o{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
      .e{stroke:#57606a;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="640" height="560" fill="#ffffff"/>
  <rect class="n" x="150" y="20" width="340" height="62" rx="10"/>
  <text class="h" x="320" y="47">Frame, 1920x1080</text>
  <text class="s" x="320" y="68">cut into 6 tiles of 640x640</text>
  <path class="e" d="M320 82V116" marker-end="url(#a)"/>
  <rect class="g" x="150" y="118" width="340" height="62" rx="10"/>
  <text class="h" x="320" y="145">FOMO-AD gate</text>
  <text class="s" x="320" y="166">scores every tile</text>
  <path class="e" d="M320 180V214" marker-end="url(#a)"/>
  <rect class="g" x="150" y="216" width="340" height="62" rx="10"/>
  <text class="h" x="320" y="243">YOLO-Pro detector</text>
  <text class="s" x="320" y="264">flagged tiles only</text>
  <path class="e" d="M250 278L110 336" marker-end="url(#a)"/>
  <path class="e" d="M320 278V336" marker-end="url(#a)"/>
  <path class="e" d="M390 278L530 336" marker-end="url(#a)"/>
  <rect class="n" x="30" y="338" width="160" height="62" rx="10"/>
  <text class="h" x="110" y="365">HMI</text>
  <text class="s" x="110" y="386">port 8080</text>
  <rect class="n" x="240" y="338" width="160" height="62" rx="10"/>
  <text class="h" x="320" y="365">Defect log</text>
  <text class="s" x="320" y="386">JSON lines</text>
  <rect class="o" x="450" y="338" width="160" height="62" rx="10"/>
  <text class="h" x="530" y="365">MQTT</text>
  <text class="s" x="530" y="386">UNS topics</text>
  <path class="e" d="M530 400V454" marker-end="url(#a)"/>
  <rect class="n" x="400" y="456" width="220" height="62" rx="10"/>
  <text class="h" x="510" y="483">Defect map</text>
  <text class="s" x="510" y="504">port 8090, SQLite history</text>
</svg>
